<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Table Tools</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="tools-shell">
      <header class="app-header">
        <a class="back-link" href="/" aria-label="Back to game hub">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 12H5"></path>
            <path d="m11 18-6-6 6-6"></path>
          </svg>
          <span>Hub</span>
        </a>
        <div>
          <p class="eyebrow">Local table helpers</p>
          <h1>Table Tools</h1>
        </div>
      </header>

      <section class="tool-grid" aria-label="Game tools">
        <article class="tool-panel timer-panel">
          <header class="panel-header">
            <div>
              <p class="eyebrow">Timer</p>
              <h2>Clock</h2>
            </div>
            <div class="segmented-control" aria-label="Timer display type">
              <button class="segment is-active" id="digitalMode" type="button" data-view="digital">Digital</button>
              <button class="segment" id="sandMode" type="button" data-view="sand">Sand</button>
            </div>
          </header>

          <div class="timer-display digital-view" id="timerDisplay" aria-live="polite">
            <div class="sandglass" id="sandglass" aria-hidden="true">
              <svg viewBox="0 0 200 300">
                <defs>
                  <clipPath id="topSandClip">
                    <path d="M 50 40 C 50 92 82 114 94 148 L 106 148 C 118 114 150 92 150 40 Z"/>
                  </clipPath>
                  <clipPath id="bottomSandClip">
                    <path d="M 94 148 C 94 182 50 208 50 260 L 150 260 C 150 208 106 182 106 148 Z"/>
                  </clipPath>
                </defs>
                <rect class="wood-post" x="34" y="24" width="9" height="252" rx="4.5"/>
                <rect class="wood-post" x="157" y="24" width="9" height="252" rx="4.5"/>
                <path class="glass" d="M 50 40 C 50 92 82 114 94 148 C 94 182 50 208 50 260 L 150 260 C 150 208 106 182 106 148 C 118 114 150 92 150 40 Z"/>
                <g clip-path="url(#topSandClip)">
                  <rect id="topSand" class="sand" x="50" y="40" width="100" height="108"/>
                </g>
                <g clip-path="url(#bottomSandClip)">
                  <rect id="bottomSand" class="sand" x="50" y="260" width="100" height="0"/>
                </g>
                <rect id="sandStream" class="sand-stream" x="97" y="148" width="6" height="0"/>
                <path class="sheen" d="M 66 54 C 66 78 78 92 86 106"/>
                <path class="sheen" d="M 86 194 C 78 208 66 222 66 246"/>
                <rect class="wood-cap" x="26" y="22" width="148" height="20" rx="7"/>
                <rect class="wood-cap" x="26" y="258" width="148" height="20" rx="7"/>
              </svg>
            </div>
            <div class="time-readout" id="timeReadout">05:00</div>
            <div class="timer-status" id="timerStatus">Ready</div>
          </div>

          <div class="preset-row" aria-label="Timer presets">
            <button class="preset-button" type="button" data-seconds="60">1m</button>
            <button class="preset-button" type="button" data-seconds="180">3m</button>
            <button class="preset-button is-active" type="button" data-seconds="300">5m</button>
            <button class="preset-button" type="button" data-seconds="600">10m</button>
          </div>

          <form class="settings-grid" id="timerForm">
            <label>
              <span>Minutes</span>
              <input id="minutesInput" type="number" inputmode="numeric" min="0" max="999" value="5">
            </label>
            <label>
              <span>Seconds</span>
              <input id="secondsInput" type="number" inputmode="numeric" min="0" max="59" value="0">
            </label>
            <button class="secondary-button" type="submit">Set</button>
          </form>

          <div class="action-row">
            <button class="primary-button" id="startPauseTimer" type="button">Start</button>
            <button class="secondary-button" id="resetTimer" type="button">Reset</button>
          </div>
        </article>

        <article class="tool-panel dice-panel">
          <header class="panel-header">
            <div>
              <p class="eyebrow">Dice</p>
              <h2>Roller</h2>
            </div>
            <button class="icon-button" id="clearHistory" type="button" aria-label="Clear roll history" title="Clear roll history">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 6h18"></path>
                <path d="M8 6V4h8v2"></path>
                <path d="m19 6-.8 14H5.8L5 6"></path>
                <path d="M10 11v5"></path>
                <path d="M14 11v5"></path>
              </svg>
            </button>
          </header>

          <div class="dice-total" aria-live="polite">
            <span>Total</span>
            <strong id="diceTotal">0</strong>
          </div>

          <form class="settings-grid dice-settings" id="diceForm">
            <label>
              <span>Dice</span>
              <input id="diceCount" type="number" inputmode="numeric" min="1" max="30" value="2">
            </label>
            <label>
              <span>Sides</span>
              <input id="diceSides" type="number" inputmode="numeric" min="2" max="1000" value="6">
            </label>
            <label>
              <span>Modifier</span>
              <input id="diceModifier" type="number" inputmode="numeric" min="-999" max="999" value="0">
            </label>
            <button class="primary-button" type="submit">Roll</button>
          </form>

          <div class="dice-tray" id="diceTray" aria-label="Dice results"></div>

          <section class="history-panel" aria-label="Roll history">
            <h3>History</h3>
            <ol id="rollHistory"></ol>
          </section>
        </article>

        <article class="tool-panel cards-panel">
          <header class="panel-header">
            <div>
              <p class="eyebrow">Cards</p>
              <h2>Deck</h2>
            </div>
            <button class="icon-button" id="clearCardHistory" type="button" aria-label="Clear draw history" title="Clear draw history">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 6h18"></path>
                <path d="M8 6V4h8v2"></path>
                <path d="m19 6-.8 14H5.8L5 6"></path>
                <path d="M10 11v5"></path>
                <path d="M14 11v5"></path>
              </svg>
            </button>
          </header>

          <div class="deck-status" aria-live="polite">
            <span>In deck</span>
            <strong id="deckRemaining">52</strong>
            <em id="deckNote">Standard 52-card deck</em>
          </div>

          <form class="settings-grid cards-settings" id="cardsForm">
            <label>
              <span>How many</span>
              <input id="drawCount" type="number" inputmode="numeric" min="1" max="10" value="3">
            </label>
            <button class="primary-button" type="submit">Draw</button>
            <button class="secondary-button" id="shuffleDeck" type="button">Shuffle</button>
          </form>

          <div class="preset-row">
            <button class="preset-button joker-toggle" id="jokersToggle" type="button" aria-pressed="false">Jokers: off</button>
          </div>

          <div class="card-tray" id="cardTray" aria-label="Drawn cards"></div>

          <section class="history-panel" aria-label="Draw history">
            <h3>History</h3>
            <ol id="cardHistory"></ol>
          </section>
        </article>

        <article class="tool-panel coin-panel">
          <header class="panel-header">
            <div>
              <p class="eyebrow">Coin</p>
              <h2>Flip</h2>
            </div>
          </header>

          <div class="coin-display" id="coinDisplay" aria-live="polite">
            <div class="coin-result" id="coinResult">Ready to flip</div>
            <div class="coin" id="coin" aria-hidden="true"><span id="coinFace">?</span></div>
            <div class="coin-tally" id="coinTally">Heads 0 · Tails 0</div>
          </div>

          <div class="action-row">
            <button class="primary-button" id="flipCoin" type="button">Flip coin</button>
            <button class="secondary-button" id="resetCoin" type="button">Reset tally</button>
          </div>
        </article>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
