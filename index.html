<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local First Game Hub</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/shared/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#236c5a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Game Hub">
  </head>
  <body>
    <main class="hub-shell">
      <section class="tabletop" aria-label="Local first game hub">
        <header class="hub-header">
          <div>
            <p class="eyebrow">Play first. Sign in only when sharing needs storage.</p>
            <h1>Local First Game Hub</h1>
            <p class="offline-pill" id="offlinePill" hidden>✈️ Offline — every cached game still plays</p>
          </div>
          <div class="hub-actions" aria-label="Hub controls">
            <input class="hub-search" id="searchGames" type="search" placeholder="Search games…" aria-label="Search games">
            <button class="profile-chip" id="profileChip" type="button" aria-label="Player profile">
              <span class="profile-avatar" id="profileAvatar">🎲</span>
              <span class="profile-meta">
                <b id="profileName">Player</b>
                <span class="profile-level" id="profileLevel">Level 1 · 0 chips</span>
                <span class="profile-bar"><span id="profileBarFill"></span></span>
              </span>
            </button>
            <button class="icon-button" id="surpriseGame" type="button" aria-label="Surprise me" title="Surprise me with a random game">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="4"></rect>
                <circle cx="8.5" cy="8.5" r="1.4"></circle>
                <circle cx="15.5" cy="8.5" r="1.4"></circle>
                <circle cx="12" cy="12" r="1.4"></circle>
                <circle cx="8.5" cy="15.5" r="1.4"></circle>
                <circle cx="15.5" cy="15.5" r="1.4"></circle>
              </svg>
            </button>
            <button class="icon-button" id="resetHub" type="button" aria-label="Reset table" title="Reset table">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 4v6h6"></path>
                <path d="M20 11a8 8 0 1 0-2.3 5.7"></path>
              </svg>
            </button>
          </div>
        </header>

        <div class="table-grid">
          <section class="game-board" aria-label="Game table">
            <div class="felt-ring" aria-hidden="true"></div>
            <div class="game-stack" id="gameStack"></div>
          </section>

          <aside class="side-panel" aria-label="Selected game">
            <div class="status-strip">
              <span id="gameStatus">Ready locally</span>
              <span id="lastPlayed">No recent launch</span>
            </div>

            <div class="selected-art" id="selectedArt" aria-hidden="true"></div>
            <p class="kicker" id="selectedType">Game</p>
            <h2 id="selectedTitle">Bingo Card Builder</h2>
            <p id="selectedDescription"></p>

            <dl class="feature-list" id="featureList"></dl>

            <div class="panel-actions">
              <a class="launch-button" id="launchGame" href="/bingo/">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 12h14"></path>
                  <path d="m13 6 6 6-6 6"></path>
                </svg>
                <span>Open</span>
              </a>
              <button class="secondary-button" id="markFavorite" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.1-5.6-2.9-5.6 2.9 1.1-6.1L3 9.6l6.2-.9L12 3z"></path>
                </svg>
                <span>Pin</span>
              </button>
            </div>
          </aside>
        </div>

        <footer class="table-tools" aria-label="Game filters">
          <button class="filter-pill is-active" type="button" data-filter="all">All</button>
          <button class="filter-pill" type="button" data-filter="solo">Solo &amp; Robot</button>
          <button class="filter-pill" type="button" data-filter="board">Boards</button>
          <button class="filter-pill" type="button" data-filter="cards">Cards</button>
          <button class="filter-pill" type="button" data-filter="score">Scorepads</button>
          <button class="filter-pill" type="button" data-filter="tools">Tools</button>
        </footer>
      </section>
    </main>

    <div class="profile-overlay" id="profileOverlay" hidden>
      <div class="profile-dialog">
        <h2>Your player card</h2>
        <div class="profile-identity">
          <span class="profile-avatar big" id="editAvatar">🎲</span>
          <label class="profile-name-field">
            <span>Name</span>
            <input id="editName" type="text" maxlength="24" placeholder="Player">
          </label>
        </div>
        <div class="profile-avatars" id="avatarRow" aria-label="Pick an avatar"></div>
        <dl class="profile-stats">
          <div><dt>Chips</dt><dd id="statChips">0</dd></div>
          <div><dt>Rank</dt><dd id="statRank">Newcomer</dd></div>
          <div><dt>Rounds</dt><dd id="statPlays">0</dd></div>
          <div><dt>To next level</dt><dd id="statNext">100</dd></div>
        </dl>
        <h3>Personal bests</h3>
        <ul class="profile-bests" id="bestsList"></ul>
        <div class="profile-dialog-actions">
          <button class="launch-button" id="saveProfile" type="button"><span>Save</span></button>
        </div>
      </div>
    </div>

    <script src="/shared/profile.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
