<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lights Out</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="back-link" href="/">Game Hub</a>
        <div>
          <p class="eyebrow">Every tap flips a plus. Turn them all off.</p>
          <h1>Lights Out</h1>
        </div>
        <button class="small-button" id="newPuzzle" type="button">New Puzzle</button>
      </header>

      <section class="controls">
        <div class="mode-row" id="sizeRow" role="radiogroup" aria-label="Board size">
          <label class="mode-card"><input type="radio" name="size" value="4"><span>4×4</span></label>
          <label class="mode-card"><input type="radio" name="size" value="5" checked><span>5×5</span></label>
          <label class="mode-card"><input type="radio" name="size" value="6"><span>6×6</span></label>
        </div>
        <div class="hud">
          <span class="hud-item">Moves <b id="moves">0</b></span>
          <span class="hud-item">Best <b id="best">—</b></span>
        </div>
      </section>

      <div class="board-frame">
        <div class="board" id="board" aria-label="Lights Out board"></div>
        <div class="overlay" id="overlay" hidden>
          <p class="overlay-title">Lights out! 🌙</p>
          <p class="overlay-sub" id="overlaySub"></p>
          <button class="primary-button" id="againButton" type="button">Next Puzzle</button>
        </div>
      </div>

      <p class="hint">Tapping a cell toggles it and its four neighbors. Clear every light.</p>
    </main>

    <script src="/shared/profile.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
