<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Breakout</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="back-link" href="/">Game Hub</a>
        <div>
          <p class="eyebrow">Smash every brick. Catch the power-ups.</p>
          <h1>Breakout</h1>
        </div>
        <button class="small-button" id="soundButton" type="button">🔊</button>
      </header>

      <section class="hud">
        <div class="hud-card"><span class="hud-label">Score</span><b id="score">0</b></div>
        <div class="hud-card"><span class="hud-label">Best</span><b id="best">0</b></div>
        <div class="hud-card"><span class="hud-label">Level</span><b id="level">1</b></div>
        <div class="hud-card"><span class="hud-label">Lives</span><b id="lives">❤️❤️❤️</b></div>
      </section>

      <div class="board-frame">
        <canvas id="board" width="420" height="560" aria-label="Breakout wall"></canvas>
        <div class="overlay" id="overlay" hidden>
          <p class="overlay-title" id="overlayTitle">Breakout</p>
          <p class="overlay-sub" id="overlaySub">Move to steer, click or tap to launch. W widens, M multiplies, S slows, ♥ gives a life.</p>
          <button class="primary-button" id="playButton" type="button">Start</button>
        </div>
      </div>

      <p class="hint">Mouse, touch, or ← → to steer · Space launches and pauses.</p>
    </main>

    <script src="/shared/profile.js"></script>
    <script src="/shared/juice.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
