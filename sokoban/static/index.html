<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Sokoban</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="back-link" href="/">Game Hub</a>
        <div>
          <p class="eyebrow">Push every crate onto a target. No pulling!</p>
          <h1>Sokoban</h1>
        </div>
        <button class="small-button" id="soundButton" type="button">🔊</button>
      </header>

      <section class="controls">
        <div class="level-nav">
          <button class="small-button" id="prevLevel" type="button">←</button>
          <span class="level-pill"><b id="levelNum">1</b>/10 · <span id="levelName">First push</span></span>
          <button class="small-button" id="nextLevel" type="button">→</button>
        </div>
        <div class="hud">
          <span class="hud-item">👟 <b id="moves">0</b></span>
          <span class="hud-item">📦 <b id="pushes">0</b></span>
          <span class="hud-item">🏅 <b id="bestPushes">—</b></span>
        </div>
      </section>

      <section class="actions">
        <button class="small-button" id="undoButton" type="button">↩ Undo</button>
        <button class="small-button" id="restartButton" type="button">Restart</button>
      </section>

      <div class="board-frame">
        <div class="board" id="board" aria-label="Sokoban warehouse"></div>
        <div class="overlay" id="overlay" hidden>
          <p class="overlay-title" id="overlayTitle">Cleared! 📦</p>
          <p class="overlay-sub" id="overlaySub"></p>
          <div class="overlay-row">
            <button class="primary-button" id="nextButton" type="button">Next level →</button>
            <button class="secondary-button" id="replayButton" type="button">Replay</button>
          </div>
        </div>
      </div>

      <div class="dpad" id="dpad" aria-label="Move controls">
        <span></span>
        <button type="button" data-dir="up" aria-label="Up">▲</button>
        <span></span>
        <button type="button" data-dir="left" aria-label="Left">◀</button>
        <button type="button" data-dir="down" aria-label="Down">▼</button>
        <button type="button" data-dir="right" aria-label="Right">▶</button>
      </div>

      <p class="hint">Arrows, WASD, swipe, or the pad to move. Walk into a crate to push it — plan ahead, crates corner easily.</p>
    </main>

    <script src="/shared/profile.js"></script>
    <script src="/shared/juice.js"></script>
    <script src="levels.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
