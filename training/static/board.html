<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training — board preview</title>
<style>
  body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #241f1a; color: #f5ead9; margin: 16px; }
  h1 { font-size: 15px; }
  p { font-size: 12px; color: #c9b9a4; }
  select { font: inherit; }
  .board-frame {
    width: min(1180px, 96vw);
    background: linear-gradient(155deg, #f6ecd8, #efe0c4);
    border: 10px solid #5e3c20;
    border-radius: 14px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
    padding: 10px;
  }
  svg { width: 100%; height: auto; display: block; }
  .city-dot { fill: #5e3c20; stroke: #3f2917; stroke-width: 2; }
  .city-inner { fill: #a86f44; }
  .city-label { font-size: 13px; font-weight: 800; fill: #4a3524; letter-spacing: .02em; }
  .map-title { font-size: 22px; font-weight: 900; fill: rgba(94, 60, 32, .5); letter-spacing: .35em; }
  .compass-ring { fill: none; stroke: rgba(94, 60, 32, .5); stroke-width: 2; }
  .compass-needle { fill: rgba(94, 60, 32, .7); }
  .compass-n { font-size: 11px; font-weight: 900; fill: rgba(94, 60, 32, .7); }
</style>
</head>
<body>
<h1>Training — board preview</h1>
<p>
  Map:
  <select id="mapSelect"></select>
  <span id="note"></span>
</p>
<div class="board-frame"><svg id="board"></svg></div>
<script src="board.js?v=3"></script>
<script>
  const SAMPLES = {
    coastline: { claims: { "portland|saltlake": "red", "losangeles|phoenix": "red", "denver|dallas": "blue", "boston|newyork": "blue" } },
    continent: { claims: { "amsterdam|frankfurt": "red", "zurich|venice": "red", "berlin|warsaw": "blue", "barcelona|madrid": "blue" } },
    orient: { claims: { "seoul|beijing": "red", "hongkong|bangkok": "red", "osaka|taipei": "blue", "delhi|mumbai": "blue" } },
  };
  const select = document.querySelector("#mapSelect");
  const note = document.querySelector("#note");
  function draw(mapId) {
    fetch(`/api/training/map?map=${encodeURIComponent(mapId)}`)
      .then((r) => r.json())
      .then((map) => {
        const spec = SAMPLES[mapId] || { claims: {} };
        const idOf = (key) => {
          const [a, b] = key.split("|");
          const route = map.routes.find((r) => (r.a === a && r.b === b) || (r.a === b && r.b === a));
          return route ? route.id : null;
        };
        const claimed = {};
        Object.keys(spec.claims).forEach((key) => {
          const id = idOf(key);
          if (id !== null) claimed[id] = spec.claims[key];
        });
        TrainingBoard.render(document.querySelector("#board"), map, { claimed });
        note.textContent = `${map.name} — ${map.cities.length} stops, ${map.routes.length} routes.`;
      });
  }
  fetch("/api/training/maps")
    .then((r) => r.json())
    .then((data) => {
      data.maps.forEach((m) => {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = m.name;
        select.append(opt);
      });
      const wanted = new URLSearchParams(location.search).get("map");
      if (wanted && data.maps.some((m) => m.id === wanted)) select.value = wanted;
      draw(select.value);
    });
  select.addEventListener("change", () => draw(select.value));
</script>
</body>
</html>
