<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training — board preview</title>
<style>
  body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #241f1a; color: #f5ead9; margin: 16px; }
  h1 { font-size: 15px; }
  p { font-size: 12px; color: #c9b9a4; }
  .board-frame {
    width: min(1180px, 96vw);
    background: linear-gradient(155deg, #f6ecd8, #efe0c4);
    border: 10px solid #5e3c20;
    border-radius: 14px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
    padding: 10px;
  }
  svg { width: 100%; height: auto; display: block; }
  .city-dot { fill: #5e3c20; stroke: #3f2917; stroke-width: 2; }
  .city-inner { fill: #a86f44; }
  .city-label { font-size: 13px; font-weight: 800; fill: #4a3524; letter-spacing: .02em; }
  .map-title { font-size: 22px; font-weight: 900; fill: rgba(94, 60, 32, .5); letter-spacing: .35em; }
  .compass-ring { fill: none; stroke: rgba(94, 60, 32, .5); stroke-width: 2; }
  .compass-needle { fill: rgba(94, 60, 32, .7); }
  .compass-n { font-size: 11px; font-weight: 900; fill: rgba(94, 60, 32, .7); }
</style>
</head>
<body>
<h1>Training — board preview</h1>
<p>
  Map:
  <select id="mapSelect">
    <option value="coastline">Coastline</option>
    <option value="continent">Continent</option>
    <option value="orient">Orient</option>
  </select>
  <span id="note">Sample claims: red holds Portland–Salt Lake City and Los Angeles–Phoenix; blue holds Denver–Dallas and Boston–New York.</span>
</p>
<div class="board-frame"><svg id="board"></svg></div>
<script src="board.js"></script>
<script>
  const SAMPLES = {
    coastline: {
      claims: { "portland|saltlake": "red", "losangeles|phoenix": "red", "denver|dallas": "blue", "boston|newyork": "blue" },
      note: "Sample claims: red holds Portland–Salt Lake City and Los Angeles–Phoenix; blue holds Denver–Dallas and Boston–New York.",
    },
    continent: {
      claims: { "amsterdam|frankfurt": "red", "zurich|venice": "red", "berlin|warsaw": "blue", "barcelona|madrid": "blue" },
      note: "Sample claims: red holds Amsterdam–Frankfurt and Zurich–Venice; blue holds Berlin–Warsaw and Barcelona–Madrid.",
    },
    orient: {
      claims: { "seoul|beijing": "red", "hongkong|bangkok": "red", "osaka|taipei": "blue", "delhi|mumbai": "blue" },
      note: "Sample claims: red holds Seoul–Beijing and Hong Kong–Bangkok; blue holds Osaka–Taipei and Delhi–Mumbai.",
    },
  };
  const select = document.querySelector("#mapSelect");
  select.value = new URLSearchParams(location.search).get("map") || "coastline";
  function draw(mapId) {
    TrainingBoard.loadMapById
      ? null
      : null;
    fetch(`/api/training/map?map=${mapId}`)
      .then((r) => r.json())
      .then((map) => {
        const spec = SAMPLES[mapId];
        const idOf = (key) => {
          const [a, b] = key.split("|");
          return map.routes.find((r) => (r.a === a && r.b === b) || (r.a === b && r.b === a)).id;
        };
        const claimed = {};
        Object.keys(spec.claims).forEach((key) => {
          claimed[idOf(key)] = spec.claims[key];
        });
        document.querySelector("#note").textContent = spec.note;
        TrainingBoard.render(document.querySelector("#board"), map, { claimed });
      });
  }
  select.addEventListener("change", () => draw(select.value));
  draw(select.value);
</script>
</body>
</html>
