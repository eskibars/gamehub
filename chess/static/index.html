<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Chess</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="back-link" href="/">Game Hub</a>
        <div>
          <p class="eyebrow">The classic duel — full rules, no mercy.</p>
          <h1>Chess</h1>
        </div>
        <button class="small-button" id="newGameButton" type="button">New game</button>
      </header>

      <section class="controls">
        <div class="mode-row" id="modeRow" role="radiogroup" aria-label="Opponent">
          <label class="mode-card"><input type="radio" name="mode" value="pass" checked><span>Pass &amp; play</span></label>
          <label class="mode-card"><input type="radio" name="mode" value="rookie"><span>🤖 Rookie</span></label>
          <label class="mode-card"><input type="radio" name="mode" value="club"><span>🤖 Club</span></label>
          <label class="mode-card"><input type="radio" name="mode" value="master"><span>🤖 Master</span></label>
        </div>
        <div class="hud">
          <span class="hud-item turn-pill" id="turnPill">⚪ White to move</span>
          <span class="hud-item">⏱ <b id="clock">0:00</b></span>
        </div>
      </section>

      <div class="board-zone">
        <div class="player-row"><span class="cap-tray" id="capTop"></span><span class="player-name" id="topName"></span><span class="mat-adv" id="matTop"></span></div>
        <div class="board-frame">
          <div class="board" id="board" aria-label="Chess board"></div>
          <div class="thinking-pill" id="thinkingPill" hidden>🤖 Thinking…</div>
          <div class="overlay" id="overlay" hidden>
            <p class="overlay-title" id="overlayTitle">Checkmate</p>
            <p class="overlay-sub" id="overlaySub"></p>
            <button class="primary-button" id="playAgain" type="button">Play again</button>
          </div>
        </div>
        <div class="player-row"><span class="cap-tray" id="capBottom"></span><span class="player-name" id="bottomName"></span><span class="mat-adv" id="matBottom"></span></div>
      </div>

      <section class="side-panel">
        <div class="side-head">
          <h2>Moves</h2>
          <div class="side-actions">
            <button class="small-button" id="undoButton" type="button">Undo</button>
            <button class="small-button" id="flipButton" type="button">Flip</button>
          </div>
        </div>
        <ol class="move-list" id="moveList" aria-label="Move list"></ol>
      </section>

      <p class="hint">Tap a piece to see its legal moves, then tap a target. Castling, en passant, and promotion are all in.</p>
    </main>

    <div class="promo-overlay" id="promoOverlay" hidden>
      <div class="promo-dialog">
        <h3>Promote to…</h3>
        <div class="promo-row" id="promoRow"></div>
      </div>
    </div>

    <script src="/shared/profile.js"></script>
    <script src="/shared/juice.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
