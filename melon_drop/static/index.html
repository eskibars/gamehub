<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Melon Drop</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="back-link" href="/">Game Hub</a>
        <div>
          <p class="eyebrow">Drop, roll, merge — build the watermelon.</p>
          <h1>Melon Drop</h1>
        </div>
        <button class="small-button" id="soundButton" type="button">🔊</button>
      </header>

      <section class="hud">
        <div class="hud-card"><span class="hud-label">Score</span><b id="score">0</b></div>
        <div class="hud-card"><span class="hud-label">Best</span><b id="best">0</b></div>
        <div class="hud-card next"><span class="hud-label">Next</span><b id="next">🍒</b></div>
      </section>

      <div class="board-frame">
        <canvas id="board" width="420" height="600" aria-label="Melon jar"></canvas>
        <div class="overlay" id="overlay" hidden>
          <p class="overlay-title" id="overlayTitle">Melon Drop</p>
          <p class="overlay-sub" id="overlaySub">Tap or click to drop fruit. Two alike merge into the next size — reach the watermelon!</p>
          <button class="primary-button" id="playButton" type="button">Start</button>
        </div>
      </div>

      <div class="evolution" id="evolution" aria-label="Merge chain"></div>

      <p class="hint">Move to aim, release to drop. Don't let fruit rest above the red line!</p>
    </main>

    <script src="/shared/profile.js"></script>
    <script src="/shared/juice.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
