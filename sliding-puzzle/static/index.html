<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sliding Puzzle</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="back-link" href="/">Game Hub</a>
        <div>
          <p class="eyebrow">Order from chaos, one slide at a time.</p>
          <h1>Sliding Puzzle</h1>
        </div>
        <button class="small-button" id="shuffleButton" type="button">Shuffle</button>
      </header>

      <section class="controls">
        <div class="mode-row" id="sizeRow" role="radiogroup" aria-label="Puzzle size">
          <label class="mode-card"><input type="radio" name="size" value="3" checked><span>3×3</span></label>
          <label class="mode-card"><input type="radio" name="size" value="4"><span>4×4</span></label>
          <label class="mode-card"><input type="radio" name="size" value="5"><span>5×5</span></label>
        </div>
        <div class="hud">
          <span class="hud-item">Moves <b id="moves">0</b></span>
          <span class="hud-item">Time <b id="timer">0s</b></span>
          <span class="hud-item">Best <b id="best">—</b></span>
        </div>
      </section>

      <div class="board-frame">
        <div class="board" id="board" aria-label="Sliding puzzle board"></div>
        <div class="overlay" id="overlay" hidden>
          <p class="overlay-title">Solved! 🎉</p>
          <p class="overlay-sub" id="overlaySub"></p>
          <button class="primary-button" id="againButton" type="button">Play Again</button>
        </div>
      </div>

      <p class="hint">Tap a tile beside the gap to slide it. Arrow keys nudge tiles into the gap.</p>
    </main>

    <script src="/shared/profile.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
