<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Gem Crush</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="back-link" href="/">Game Hub</a>
        <div>
          <p class="eyebrow">Swap. Cascade. Crush the goal.</p>
          <h1>Gem Crush</h1>
        </div>
        <button class="small-button" id="soundButton" type="button">🔊</button>
      </header>

      <section class="hud">
        <div class="hud-card"><span class="hud-label">Level</span><b id="level">1</b></div>
        <div class="hud-card"><span class="hud-label">Score</span><b id="score">0</b></div>
        <div class="hud-card goal"><span class="hud-label">Goal</span><b id="goal">1000</b></div>
        <div class="hud-card"><span class="hud-label">Moves</span><b id="moves">20</b></div>
      </section>

      <div class="progress-track"><span class="progress-fill" id="progressFill"></span></div>

      <div class="board-frame">
        <div class="board" id="board" aria-label="Gem board"></div>
        <div class="overlay" id="overlay" hidden>
          <p class="overlay-title" id="overlayTitle">Level 1</p>
          <p class="overlay-sub" id="overlaySub">Reach 1000 points in 20 moves</p>
          <button class="primary-button" id="overlayButton" type="button">Start</button>
        </div>
      </div>

      <p class="hint">Tap two neighboring gems to swap. Match 4 for a striped blast, an L for a bomb, 5 for a rainbow. Combos multiply!</p>
    </main>

    <script src="/shared/profile.js"></script>
    <script src="/shared/juice.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
