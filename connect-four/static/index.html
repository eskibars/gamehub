<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connect Four</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="back-link" href="/">Game Hub</a>
        <div>
          <p class="eyebrow">Four in a row wins the round</p>
          <h1>Connect Four</h1>
        </div>
        <button class="small-button" id="resetBoard" type="button">New Round</button>
      </header>

      <section class="setup-view" id="setupView">
        <form class="setup-panel" id="setupForm">
          <div class="section-heading"><h2>Start Playing</h2></div>
          <div class="mode-row" role="radiogroup" aria-label="Opponent">
            <label class="mode-card"><input type="radio" name="opponent" value="human" checked><span>Two Players</span></label>
            <label class="mode-card"><input type="radio" name="opponent" value="easy"><span>Robot · Easy</span></label>
            <label class="mode-card"><input type="radio" name="opponent" value="medium"><span>Robot · Medium</span></label>
            <label class="mode-card"><input type="radio" name="opponent" value="hard"><span>Robot · Hard</span></label>
          </div>
          <button class="primary-button" type="submit">Start</button>
        </form>
      </section>

      <section class="game-view" id="gameView" hidden>
        <div class="score-strip" aria-label="Round score">
          <span class="side red" id="redLabel">Red</span>
          <span class="tally" id="tally">0 — 0</span>
          <span class="side yellow" id="yellowLabel">Yellow</span>
        </div>
        <p class="turn-line" id="turnLine">Red drops first</p>
        <div class="board-frame">
          <div class="board" id="board" aria-label="Connect four board"></div>
        </div>
        <p class="hint" id="hintLine">Tap a column to drop your disc.</p>
      </section>
    </main>

    <script src="/shared/profile.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
